name: Hourly speed & uptime check

on:
  schedule:
    - cron: '7 * * * *'        # every hour at :07 (UTC). GitHub may start it a few minutes late.
  workflow_dispatch: {}         # adds a "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: monitor-data           # never let two checks write data at the same time
  cancel-in-progress: false

jobs:
  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run speed & uptime check
        id: check
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: node scripts/speed-check.mjs
      - name: Save results
        if: always()
        run: bash scripts/commit-data.sh "speed check"
      - name: Alert if site went down (GitHub emails you on failure)
        if: steps.check.outputs.alert == 'true'
        run: |
          echo "::error::WEBSITE DOWN - ${{ steps.check.outputs.alert_text }}"
          exit 1
